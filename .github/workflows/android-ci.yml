name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Provision debug.keystore and CI google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          if [ ! -f app/google-services.json ]; then
            if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
              printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            else
              cat <<'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "paper-critic-ci-test",
              "storage_bucket": "paper-critic-ci-test.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.aistudio.papercritic.jqkvwx"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "CI_TEST_PLACEHOLDER_WEB_CLIENT_ID",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "CI_TEST_PLACEHOLDER_API_KEY"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
            fi
          fi
          chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Run Pure Kotlin Unit Test Suites
        run: >
          ./gradlew :app:testDebugUnitTest --no-daemon
          --tests "com.example.ExampleUnitTest"
          --tests "com.example.StatisticalAuditSubsystemTest"
          --tests "com.example.EpistemicSafeguardsAndCalibrationTest"
          --tests "com.example.Phase8TrustAbstentionSemanticTest"
          --tests "com.example.Phase9TrustValidationRevisionTest"
          --tests "com.example.Phase10PdfIdentityApplicabilityTest"

      - name: Run Robolectric & End-to-End Integration Test Suites
        run: >
          ./gradlew :app:testDebugUnitTest --no-daemon
          --tests "com.example.ExampleRobolectricTest"
          --tests "com.example.EnterpriseAndScientificTruthGateTest"

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug --no-daemon

  firestore-rules-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (for Firebase Emulators & Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Provision debug.keystore, CI google-services.json, and gradlew permissions
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          if [ ! -f app/google-services.json ]; then
            if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
              printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            else
              cat <<'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "paper-critic-ci-test",
              "storage_bucket": "paper-critic-ci-test.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.aistudio.papercritic.jqkvwx"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "CI_TEST_PLACEHOLDER_WEB_CLIENT_ID",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "CI_TEST_PLACEHOLDER_API_KEY"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
            fi
          fi
          chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Firestore Rules Test Runner Dependency
        run: npm install --no-save --no-audit --no-fund @firebase/rules-unit-testing

      - name: Run Firestore Security Rules Emulator Suite (Node)
        run: npx --yes firebase-tools emulators:exec --only firestore "node --test firestore.test.js"

      - name: Run Android Repository Security Rules Suite (Auth + Firestore Emulators)
        run: >
          npx --yes firebase-tools emulators:exec --only auth,firestore
          './gradlew :app:testDebugUnitTest --no-daemon --tests "com.example.data.repository.ReviewRepositoryRuleTest"'
